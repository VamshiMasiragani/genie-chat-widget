<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Genie Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

  :root{
    --bg: #111010;
    --card: #1A1717;
    --surface: #282525;
    --teal: #67EADD;
    --teal-light: #22DBC8;
    --teal-mid: #3EA2A8;
    --border: rgba(103,234,221,0.3);
    --border-light: rgba(103,234,221,0.2);
    --text: #FFFFFF;
    --text-secondary: rgba(255,255,255,0.85);
    --text-tertiary: rgba(255,255,255,0.7);
    --text-muted: rgba(255,255,255,0.6);
    --amber: #F59E0B;
    --green: #10B981;
    --red: #EF4444;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    font-weight: 400;
  }

  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    max-width: 640px;
    margin: 0 auto;
    background: var(--bg);
    border-left: 1px solid var(--border-light);
    border-right: 1px solid var(--border-light);
  }

  /* ---------- Header ---------- */
  .header{
    display:flex;
    align-items:center;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    background: var(--card);
    border-bottom: 1px solid var(--border-light);
    flex-shrink:0;
  }

  .orb{
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 100%);
    position: relative;
    flex-shrink:0;
    box-shadow: 0 0 0 0 rgba(103,234,221,0.5);
  }
  .orb.active{ animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(103,234,221,0.45); }
    70%{ box-shadow: 0 0 0 10px rgba(103,234,221,0); }
    100%{ box-shadow: 0 0 0 0 rgba(103,234,221,0); }
  }

  .header-text h1{
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: var(--text);
  }
  .header-text p{
    font-size: 12px;
    margin: 2px 0 0;
    color: var(--text-muted);
  }

  .header-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap: 0.5rem;
  }

  .mode-pill{
    font-size: 11px;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--teal-light);
    background: rgba(103,234,221,0.08);
    white-space: nowrap;
  }

  .icon-btn{
    width: 32px; height: 32px;
    border-radius: 0.375rem;
    border: 1px solid var(--border-light);
    background: transparent;
    color: var(--text-tertiary);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover{ border-color: var(--teal); color: var(--teal-light); }
  .icon-btn:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }

  /* ---------- Sign-in screen ---------- */
  .signin{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 2rem;
    text-align:center;
    gap: 1.25rem;
  }
  .signin .orb-big{
    width: 64px; height:64px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 100%);
  }
  .signin h2{
    font-size: 22px;
    font-weight: 600;
    margin:0;
    color: var(--teal-light);
  }
  .signin p{
    font-size: 14px;
    color: var(--text-tertiary);
    max-width: 320px;
    line-height: 1.5;
    margin:0;
  }

  .btn{
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 0.7rem 1.4rem;
    border-radius: 0.5rem;
    border: none;
    cursor:pointer;
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 100%);
    color: #0B0F0E;
  }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-secondary{
    background: transparent;
    color: var(--teal-light);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover{ border-color: var(--teal); }

  /* ---------- Message list ---------- */
  .messages{
    flex:1;
    overflow-y:auto;
    padding: 1.25rem;
    display:flex;
    flex-direction:column;
    gap: 0.9rem;
  }

  .msg{
    max-width: 78%;
    padding: 0.7rem 0.95rem;
    border-radius: 0.75rem;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-mid) 100%);
    color: #0B0F0E;
    border-bottom-right-radius: 0.2rem;
  }
  .msg.genie{
    align-self:flex-start;
    background: var(--card);
    border: 1px solid var(--border-light);
    color: var(--text-secondary);
    border-bottom-left-radius: 0.2rem;
  }
  .msg.system{
    align-self:center;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-muted);
    font-size: 12px;
    padding: 0.4rem 0.8rem;
  }

  .typing{
    align-self:flex-start;
    display:flex;
    gap: 4px;
    padding: 0.8rem 1rem;
    background: var(--card);
    border: 1px solid var(--border-light);
    border-radius: 0.75rem;
    border-bottom-left-radius: 0.2rem;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background: var(--teal-light);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity: 0.5; }
    30%{ transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- Approval banner ---------- */
  .approval{
    margin: 0 1.25rem 0.9rem;
    padding: 0.85rem 1rem;
    border-radius: 0.5rem;
    background: rgba(245,158,11,0.1);
    border: 1px solid var(--amber);
    display:flex;
    flex-direction:column;
    gap: 0.6rem;
  }
  .approval .approval-title{
    font-size: 13px;
    font-weight: 600;
    color: var(--amber);
  }
  .approval .approval-detail{
    font-size: 13px;
    color: var(--text-tertiary);
  }
  .approval-actions{
    display:flex;
    gap: 0.5rem;
  }
  .approval-actions button{
    font-family:'Poppins',sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 0.4rem 0.8rem;
    border-radius: 0.375rem;
    cursor:pointer;
    border: 1px solid transparent;
  }
  .approve-btn{ background: var(--green); color: #0B0F0E; }
  .reject-btn{ background: transparent; border-color: var(--red); color: var(--red); }

  /* ---------- Composer ---------- */
  .composer{
    flex-shrink:0;
    display:flex;
    align-items:flex-end;
    gap: 0.6rem;
    padding: 1rem 1.25rem;
    background: var(--card);
    border-top: 1px solid var(--border-light);
  }
  .composer textarea{
    flex:1;
    resize:none;
    max-height: 120px;
    min-height: 42px;
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: 0.5rem;
    color: var(--text);
    font-family:'Poppins',sans-serif;
    font-size: 14px;
    padding: 0.65rem 0.85rem;
    outline:none;
  }
  .composer textarea:focus{ border-color: var(--teal); }
  .composer textarea::placeholder{ color: var(--text-muted); }

  .send-btn{
    width: 42px; height: 42px;
    border-radius: 0.5rem;
    border:none;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 100%);
    color: #0B0F0E;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition: filter 0.15s ease, opacity 0.15s ease;
  }
  .send-btn:hover{ filter: brightness(1.08); }
  .send-btn:disabled{ opacity: 0.4; cursor:not-allowed; }

  .footer-note{
    text-align:center;
    font-size: 10px;
    color: var(--text-muted);
    padding: 0.4rem 0 0.9rem;
    background: var(--card);
  }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: var(--surface); border-radius: 4px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  @media (prefers-reduced-motion: reduce){
    .orb.active, .typing span{ animation: none; }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <div class="header">
    <div class="orb" id="orb"></div>
    <div class="header-text">
      <h1 id="genieName">IT Support Genie</h1>
      <p id="genieStatus">Not connected</p>
    </div>
    <div class="header-right">
      <span class="mode-pill" id="modePill">Demo mode</span>
      <button class="icon-btn" id="resetBtn" title="Reset conversation" aria-label="Reset conversation">↺</button>
    </div>
  </div>

  <!-- Sign-in screen -->
  <div class="signin" id="signinScreen">
    <div class="orb-big"></div>
    <h2>Sign in to start chatting</h2>
    <p>This connects to your genie through Workato's Headless API. Your organization's login handles authentication — Workato never sees your password.</p>
    <button class="btn btn-primary" id="signinBtn">Sign in with your organization</button>
    <button class="btn btn-secondary" id="demoBtn">Try demo instead</button>
  </div>

  <!-- Chat screen (hidden until connected) -->
  <div id="chatScreen" style="display:none; flex:1; display:none; flex-direction:column; min-height:0;">
    <div class="messages" id="messages"></div>
    <div id="approvalSlot"></div>
    <div class="composer">
      <textarea id="input" placeholder="Message your genie..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="#0B0F0E" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="footer-note">Demo mode simulates responses locally — no data leaves this page</div>
</div>

<script>
/* =====================================================================
   CONFIGURATION
   Replace these with your genie's real values before going live.
   ===================================================================== */
const CONFIG = {
  DEMO_MODE: true,                    // set to false once real values below are filled in
  DATA_CENTER_API: "https://www.workato.com",          // Dev API base URL for your data center
  HEADLESS_API_BASE: "https://genie-api.workato.com",  // Headless API base URL for your data center
  GENIE_HANDLE: "gin-XXXXXXXX-XXXXXXXX",               // your genie's handle
  OAUTH_CLIENT_ID: "YOUR_OAUTH_CLIENT_ID",             // from "Create a genie client" response
  REDIRECT_URI: "https://your-app-domain.com/callback",// must match the client's oauth_redirect_url
  // Token exchange MUST happen server-side per Workato's guidance.
  // Point this at a backend endpoint you control (e.g. a Workato recipe
  // with an HTTP trigger) that takes { code, code_verifier } and returns
  // { access_token, refresh_token }. Never exchange the code directly
  // in browser JS in production.
  TOKEN_EXCHANGE_ENDPOINT: "https://your-backend.example.com/api/token-exchange"
};

/* =====================================================================
   PKCE HELPERS (used only when DEMO_MODE is false)
   ===================================================================== */
function base64UrlEncode(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function generatePKCE() {
  const verifierBytes = new Uint8Array(64);
  crypto.getRandomValues(verifierBytes);
  const verifier = base64UrlEncode(verifierBytes.buffer).slice(0, 128);
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  const challenge = base64UrlEncode(digest);
  return { verifier, challenge };
}

async function beginLogin() {
  const { verifier, challenge } = await generatePKCE();
  sessionStorage.setItem('pkce_verifier', verifier);
  const state = crypto.randomUUID();
  sessionStorage.setItem('oauth_state', state);

  const authUrl = new URL('https://id.workato.com/oauth/authorize');
  authUrl.searchParams.set('response_type', 'code');
  authUrl.searchParams.set('client_id', CONFIG.OAUTH_CLIENT_ID);
  authUrl.searchParams.set('redirect_uri', CONFIG.REDIRECT_URI);
  authUrl.searchParams.set('scope', 'openid profile email');
  authUrl.searchParams.set('state', state);
  authUrl.searchParams.set('code_challenge', challenge);
  authUrl.searchParams.set('code_challenge_method', 'S256');

  window.location.href = authUrl.toString();
}

async function completeLoginIfRedirected() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  if (!code) return null;

  if (state !== sessionStorage.getItem('oauth_state')) {
    throw new Error('OAuth state mismatch — possible CSRF, aborting.');
  }

  const verifier = sessionStorage.getItem('pkce_verifier');
  const res = await fetch(CONFIG.TOKEN_EXCHANGE_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code, code_verifier: verifier, redirect_uri: CONFIG.REDIRECT_URI })
  });
  if (!res.ok) throw new Error('Token exchange failed');
  const tokens = await res.json();
  sessionStorage.setItem('access_token', tokens.access_token);
  if (tokens.refresh_token) sessionStorage.setItem('refresh_token', tokens.refresh_token);

  window.history.replaceState({}, document.title, window.location.pathname);
  return tokens.access_token;
}

/* =====================================================================
   HEADLESS API CALLS (real mode)
   ===================================================================== */
async function apiHeaders() {
  const token = sessionStorage.getItem('access_token');
  return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
}

async function createConversation() {
  const res = await fetch(
    `${CONFIG.HEADLESS_API_BASE}/api/v1/genies/${CONFIG.GENIE_HANDLE}/chat/conversations`,
    { method: 'POST', headers: await apiHeaders() }
  );
  const data = await res.json();
  return data.conversation_id;
}

async function sendMessage(conversationId, message) {
  const res = await fetch(
    `${CONFIG.HEADLESS_API_BASE}/api/v1/genies/${CONFIG.GENIE_HANDLE}/chat/conversations/${conversationId}/messages`,
    {
      method: 'POST',
      headers: await apiHeaders(),
      body: JSON.stringify({ message, stream: false })
    }
  );
  return res.json();
}

async function pollConversation(conversationId) {
  while (true) {
    const res = await fetch(
      `${CONFIG.HEADLESS_API_BASE}/api/v1/genies/${CONFIG.GENIE_HANDLE}/chat/conversations/${conversationId}`,
      { headers: await apiHeaders() }
    );
    const data = await res.json();
    if (data.state === 'idle') return { done: true };
    if (data.state === 'awaiting_approval') return { done: false, awaitingApproval: true, lastEvent: data.last_event };
    await new Promise(r => setTimeout(r, 2000));
  }
}

async function fetchLatestMessage(conversationId) {
  const res = await fetch(
    `${CONFIG.HEADLESS_API_BASE}/api/v1/genies/${CONFIG.GENIE_HANDLE}/chat/conversations/${conversationId}/messages?limit=1`,
    { headers: await apiHeaders() }
  );
  const data = await res.json();
  return data.messages && data.messages[0];
}

async function resolveApproval(conversationId, callId, resolution) {
  await fetch(
    `${CONFIG.HEADLESS_API_BASE}/api/v1/genies/${CONFIG.GENIE_HANDLE}/chat/conversations/${conversationId}/business_approval/${callId}`,
    { method: 'POST', headers: await apiHeaders(), body: JSON.stringify({ resolution }) }
  );
}

/* =====================================================================
   DEMO MODE — simulated conversation, no network calls
   ===================================================================== */
const DEMO_RESPONSES = [
  { text: "Hi! I can help troubleshoot access issues, reset passwords, or open a ticket. What's going on?", approval: false },
  { text: "Got it. I checked your account — your VPN certificate expired 2 days ago. I can reissue it now.", approval: false },
  { text: "Before I reissue the certificate, that action needs manager approval since it touches network access.", approval: true },
  { text: "Approved — your new VPN certificate is provisioned. It should sync to your device within 5 minutes.", approval: false }
];
let demoStep = 0;

function simulateGenieReply(userText) {
  return new Promise(resolve => {
    setTimeout(() => {
      const reply = DEMO_RESPONSES[demoStep % DEMO_RESPONSES.length];
      demoStep++;
      resolve(reply);
    }, 900 + Math.random() * 700);
  });
}

/* =====================================================================
   UI WIRING
   ===================================================================== */
const el = {
  signinScreen: document.getElementById('signinScreen'),
  chatScreen: document.getElementById('chatScreen'),
  messages: document.getElementById('messages'),
  input: document.getElementById('input'),
  sendBtn: document.getElementById('sendBtn'),
  signinBtn: document.getElementById('signinBtn'),
  demoBtn: document.getElementById('demoBtn'),
  resetBtn: document.getElementById('resetBtn'),
  orb: document.getElementById('orb'),
  genieStatus: document.getElementById('genieStatus'),
  modePill: document.getElementById('modePill'),
  approvalSlot: document.getElementById('approvalSlot')
};

let currentConversationId = null;
let isDemo = CONFIG.DEMO_MODE;

el.modePill.textContent = isDemo ? 'Demo mode' : 'Live';

function addMessage(text, role) {
  const bubble = document.createElement('div');
  bubble.className = `msg ${role}`;
  bubble.textContent = text;
  el.messages.appendChild(bubble);
  el.messages.scrollTop = el.messages.scrollHeight;
  return bubble;
}

function addTypingIndicator() {
  const wrap = document.createElement('div');
  wrap.className = 'typing';
  wrap.id = 'typingIndicator';
  wrap.innerHTML = '<span></span><span></span><span></span>';
  el.messages.appendChild(wrap);
  el.messages.scrollTop = el.messages.scrollHeight;
}

function removeTypingIndicator() {
  const node = document.getElementById('typingIndicator');
  if (node) node.remove();
}

function showApprovalBanner(detailText, onResolve) {
  el.approvalSlot.innerHTML = '';
  const banner = document.createElement('div');
  banner.className = 'approval';
  banner.innerHTML = `
    <div class="approval-title">Approval needed</div>
    <div class="approval-detail">${detailText}</div>
    <div class="approval-actions">
      <button class="approve-btn">Approve</button>
      <button class="reject-btn">Reject</button>
    </div>
  `;
  banner.querySelector('.approve-btn').onclick = () => { onResolve('approved'); banner.remove(); };
  banner.querySelector('.reject-btn').onclick = () => { onResolve('rejected'); banner.remove(); };
  el.approvalSlot.appendChild(banner);
}

async function startConversation() {
  el.signinScreen.style.display = 'none';
  el.chatScreen.style.display = 'flex';
  el.orb.classList.add('active');
  el.genieStatus.textContent = isDemo ? 'Demo conversation' : 'Connected';
  addMessage('Conversation started.', 'system');

  if (!isDemo) {
    try {
      currentConversationId = await createConversation();
    } catch (e) {
      addMessage('Could not start a conversation — check your genie configuration.', 'system');
      console.error(e);
    }
  }
}

async function handleSend() {
  const text = el.input.value.trim();
  if (!text) return;
  el.input.value = '';
  el.input.style.height = 'auto';
  addMessage(text, 'user');
  addTypingIndicator();
  el.sendBtn.disabled = true;

  try {
    if (isDemo) {
      const reply = await simulateGenieReply(text);
      removeTypingIndicator();
      addMessage(reply.text, 'genie');
      if (reply.approval) {
        showApprovalBanner('Reissue VPN certificate for your device', (resolution) => {
          addMessage(`You ${resolution} the request.`, 'system');
          if (resolution === 'approved') {
            setTimeout(async () => {
              addTypingIndicator();
              const followUp = await simulateGenieReply('');
              removeTypingIndicator();
              addMessage(followUp.text, 'genie');
            }, 600);
          }
        });
      }
    } else {
      await sendMessage(currentConversationId, text);
      const result = await pollConversation(currentConversationId);
      removeTypingIndicator();
      if (result.awaitingApproval) {
        const event = result.lastEvent || {};
        showApprovalBanner(event.skill_name || 'Pending action requires approval', async (resolution) => {
          await resolveApproval(currentConversationId, event.call_id, resolution);
          const finalResult = await pollConversation(currentConversationId);
          if (finalResult.done) {
            const msg = await fetchLatestMessage(currentConversationId);
            if (msg) addMessage(msg.content, 'genie');
          }
        });
      } else {
        const msg = await fetchLatestMessage(currentConversationId);
        if (msg) addMessage(msg.content, 'genie');
      }
    }
  } catch (e) {
    removeTypingIndicator();
    addMessage('Something went wrong reaching the genie. Please try again.', 'system');
    console.error(e);
  } finally {
    el.sendBtn.disabled = false;
  }
}

el.input.addEventListener('input', () => {
  el.input.style.height = 'auto';
  el.input.style.height = Math.min(el.input.scrollHeight, 120) + 'px';
});
el.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
el.sendBtn.addEventListener('click', handleSend);

el.demoBtn.addEventListener('click', () => {
  isDemo = true;
  el.modePill.textContent = 'Demo mode';
  startConversation();
});

el.signinBtn.addEventListener('click', async () => {
  if (isDemo) {
    // Config still points at demo — real login needs CONFIG values filled in.
    startConversation();
    return;
  }
  try {
    await beginLogin();
  } catch (e) {
    console.error(e);
  }
});

el.resetBtn.addEventListener('click', () => {
  el.messages.innerHTML = '';
  el.approvalSlot.innerHTML = '';
  demoStep = 0;
  currentConversationId = null;
  el.chatScreen.style.display = 'none';
  el.signinScreen.style.display = 'flex';
  el.orb.classList.remove('active');
  el.genieStatus.textContent = 'Not connected';
});

/* =====================================================================
   BOOTSTRAP
   ===================================================================== */
(async function init() {
  if (!CONFIG.DEMO_MODE) {
    try {
      const token = await completeLoginIfRedirected();
      if (token) { await startConversation(); return; }
    } catch (e) {
      console.error(e);
    }
  }
  // Otherwise wait at the sign-in screen for user action.
})();
</script>

</body>
</html>
